[package]
name = "sts2-character-creator"
version = "0.1.0"
description = "A local-first visual Slay the Spire 2 character creator"
authors = ["STS2 Character Creator"]
edition = "2021"

[lib]
name = "sts2_character_creator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
